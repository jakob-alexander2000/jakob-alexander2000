<svg xmlns="http://www.w3.org/2000/svg" width="760" height="168" viewBox="0 0 760 168" role="img">
  <title>CiteBot verify step</title>
  <desc>A question goes to at most three handbook tools, then a draft written by the model. Verify marks each claim pass, fail, or unsupported against those same passages.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .line { stroke: #f2f2f2; }
      .arrow { stroke: #f2f2f2; }
      .label { fill: #f2f2f2; }
      .quiet { fill: #c8c8c8; }
    }
  </style>
  <rect class="bg" width="760" height="168" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M1 1 L7 4 L1 7" fill="none" stroke="#141414" stroke-width="1"/>
    </marker>
  </defs>
  <g class="line" fill="none" stroke="#141414" stroke-width="1">
    <rect x="20" y="16" width="150" height="58"/>
    <rect x="214" y="16" width="178" height="58"/>
    <rect x="436" y="16" width="168" height="58"/>
    <rect x="214" y="112" width="390" height="40"/>
    <line x1="170" y1="45" x2="206" y2="45" marker-end="url(#arrow)"/>
    <line x1="392" y1="45" x2="428" y2="45" marker-end="url(#arrow)"/>
    <line x1="303" y1="74" x2="303" y2="108" marker-end="url(#arrow)"/>
    <line x1="520" y1="74" x2="520" y2="108" marker-end="url(#arrow)"/>
  </g>
  <g class="label" fill="#141414" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="95" y="50" font-size="15">Question</text>
    <text x="303" y="40" font-size="15">Handbook tools</text>
    <text class="quiet" x="303" y="58" font-size="12" fill="#4a4a4a">at most three</text>
    <text x="520" y="40" font-size="15">Draft</text>
    <text class="quiet" x="520" y="58" font-size="12" fill="#4a4a4a">the model writes it</text>
    <text class="quiet" x="411" y="100" font-size="12" fill="#4a4a4a">same passages</text>
    <text x="409" y="137" font-size="14">Verify: pass, fail, or unsupported</text>
  </g>
</svg>
